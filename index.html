<!doctype html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Reliance Auto Mechanic</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111;color:#fff;padding:22px 18px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:21px}header small{opacity:.68}main{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #00000012}.muted{color:#707070;font-size:13px}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#e7f5ea;color:#176b35;font-size:12px;font-weight:700}.button{width:100%;border:0;border-radius:13px;padding:13px;margin-top:9px;background:#111;color:#fff;font-weight:700;font-size:15px}.button.light{background:#ececef;color:#111}.button.good{background:#176b35}.button.danger{background:#8b1e1e}.button.compact{width:auto;padding:10px 13px;margin:0}.input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;margin-top:7px;background:#fff}textarea{min-height:90px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.tabs button{border:0;padding:10px;border-radius:10px;background:#e7e7ea;font-weight:700}.tabs .active{background:#111;color:#fff}.vehicle,.repairFile{cursor:pointer}.vehicle h3,.repairFile h3{margin:0 0 5px}.searchRow{display:grid;grid-template-columns:1fr 150px;gap:8px}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mediaCard{background:#f7f7f8;border-radius:14px;padding:8px}.media{width:100%;height:180px;object-fit:cover;border-radius:11px;background:#ddd;cursor:pointer}.timeline{border-left:3px solid #ddd;padding-left:14px}.event{margin:0 0 18px}.event b{display:block}.addMedia{display:flex;align-items:center;gap:12px;border:1px solid #e1e1e1;border-radius:15px;padding:12px;background:#fafafa;cursor:pointer}.plus{width:48px;height:48px;border-radius:50%;border:0;background:#111;color:#fff;font-size:30px}.modal{position:fixed;inset:0;background:#000c;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal.center{align-items:center}.modalInner{background:#fff;width:min(760px,100%);max-height:96vh;overflow:auto;border-radius:18px;padding:14px}.action{width:100%;text-align:left;border:0;background:#f4f4f6;border-radius:12px;padding:14px;margin-top:8px;font-size:16px;font-weight:700}.docCard{display:flex;gap:10px;align-items:center;padding:14px;background:#fff;border:1px solid #ddd;border-radius:12px}.docIcon{font-size:30px}.docLink{color:#111;font-weight:700;text-decoration:none;word-break:break-word}.rowButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tinyDanger{border:0;border-radius:10px;padding:10px;background:#f7dfdf;color:#8b1e1e;font-weight:700;width:100%;margin-top:8px}.hidden{display:none}.status{padding:10px;border-radius:10px;background:#fff4d6;color:#6f4c00;margin:10px 0}.pillRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{background:#ededf0;border-radius:20px;padding:6px 10px;font-size:12px}.gallery{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}.galleryTop{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:12px 14px}.galleryClose{border:0;background:#fff;color:#111;border-radius:50%;width:40px;height:40px;font-size:22px}.galleryTrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;flex:1;-webkit-overflow-scrolling:touch}.gallerySlide{min-width:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:12px}.gallerySlide img{max-width:100%;max-height:82vh;object-fit:contain}.canvasWrap{background:#222;border-radius:12px;overflow:auto;text-align:center}.canvasWrap canvas{max-width:100%;touch-action:none}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}@media(max-width:520px){.photoGrid{grid-template-columns:1fr}.media{height:230px}.searchRow{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body><div id="app"></div><div id="modal"></div><div id="gallery"></div>
<script>
const SUPABASE_URL='https://qsexlyqyfvncnudqhlzu.supabase.co';
const SUPABASE_KEY='sb_publishable_rO6RO8kd83amNcv6s9NCWw_PvS_zIn5';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,vehicles=[],repairs=[],currentVehicle=null,current=null,currentMedia=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=d=>d?new Date(d).toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'';
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString([], {year:'numeric',month:'short',day:'numeric'}):'';
function head(sub='Vehicle Service History'){return `<header><h1>Reliance Auto Mechanic</h1><small>${sub}</small></header>`}
async function init(){const hash=location.hash;if(hash.startsWith('#customer/'))return renderCustomer(hash.split('/')[1]);const {data}=await sb.auth.getSession();session=data.session;if(!session)return renderLogin();await loadDashboard()}
function renderLogin(msg=''){document.getElementById('app').innerHTML=head('Staff Login')+`<main><div class="card"><h2>Staff Sign In</h2>${msg?`<div class="status">${esc(msg)}</div>`:''}<input class="input" id="email" type="email" placeholder="Email"><input class="input" id="password" type="password" placeholder="Password"><button class="button" onclick="signIn()">Sign In</button><button class="button light" onclick="signUp()">Create Staff Account</button></div></main>`}
async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)return renderLogin(error.message);init()}
async function signUp(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signUp({email,password});if(error)return renderLogin(error.message);renderLogin('Account created. Confirm your email if required, then sign in.')}
async function signOut(){await sb.auth.signOut();session=null;renderLogin()}
async function loadDashboard(){const [{data:v,error:ve},{data:r,error:re}]=await Promise.all([sb.from('vehicles').select('*').order('created_at',{ascending:false}),sb.from('repairs').select('*').order('service_date',{ascending:false})]);if(ve||re)return setupNeeded((ve||re).message);vehicles=v||[];repairs=r||[];renderDashboard()}
function setupNeeded(msg){document.getElementById('app').innerHTML=head('Database Update Needed')+`<main><div class="card"><h2>One database update is required</h2><div class="status">${esc(msg)}</div><p>Open the latest supabase setup SQL file in GitHub, run it in Supabase SQL Editor, then refresh this page.</p></div></main>`}
function renderDashboard(){document.getElementById('app').innerHTML=head()+`<main><div class="tabs"><button class="active">Vehicles</button><button onclick="renderGlobalSearch()">Search</button><button onclick="newVehicle()">New Vehicle</button></div><div class="card"><h2>Vehicle Files</h2><input class="input" id="vehicleSearch" placeholder="Search customer, VIN, plate, year, make or model" oninput="filterVehicles()"></div><div id="vehicleList">${vehicleCards(vehicles)}</div><button class="button" onclick="newVehicle()">Create Vehicle File</button><button class="button light" onclick="signOut()">Sign Out</button></main>`}
function vehicleCards(list){return list.map(v=>`<div class="card vehicle" onclick="openVehicle('${v.id}')"><div class="topline"><div><h3>${esc(v.display_name||[v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle')}</h3><div class="muted">${esc([v.year,v.make,v.model].filter(Boolean).join(' '))}${v.customer_name?' • '+esc(v.customer_name):''}</div><div class="pillRow">${v.vin?`<span class="pill">VIN ${esc(v.vin)}</span>`:''}${v.license_plate?`<span class="pill">Plate ${esc(v.license_plate)}</span>`:''}</div></div><span>›</span></div></div>`).join('')||'<div class="card">No vehicle files yet.</div>'}
function filterVehicles(){const q=document.getElementById('vehicleSearch').value.toLowerCase().trim();const list=!q?vehicles:vehicles.filter(v=>[v.display_name,v.year,v.make,v.model,v.vin,v.license_plate,v.customer_name,v.customer_phone].join(' ').toLowerCase().includes(q));document.getElementById('vehicleList').innerHTML=vehicleCards(list)}
async function newVehicle(){const display_name=prompt('Name this vehicle file. Example: John Smith Silverado')||'';const year=prompt('Year')||'',make=prompt('Make')||'',model=prompt('Model')||'',vin=prompt('VIN')||'',license_plate=prompt('License plate')||'',customer_name=prompt('Customer name')||'',customer_phone=prompt('Customer phone')||'';const {data,error}=await sb.from('vehicles').insert({display_name,year,make,model,vin,license_plate,customer_name,customer_phone}).select().single();if(error)return alert(error.message);await openVehicle(data.id)}
async function openVehicle(id){const {data:v,error}=await sb.from('vehicles').select('*').eq('id',id).single();if(error)return alert(error.message);currentVehicle=v;const {data:r,error:re}=await sb.from('repairs').select('*').eq('vehicle_id',id).order('service_date',{ascending:false});if(re)return alert(re.message);repairs=r||[];renderVehicle()}
function renderVehicle(){const v=currentVehicle;document.getElementById('app').innerHTML=head('Vehicle File')+`<main><button class="button light" onclick="loadDashboard()">Back to Vehicles</button><div class="card"><div class="topline"><div><h2>${esc(v.display_name||[v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle')}</h2><div>${esc([v.year,v.make,v.model].filter(Boolean).join(' '))}</div><div class="muted">${esc(v.customer_name)} ${v.customer_phone?'• '+esc(v.customer_phone):''}</div></div><button class="button compact light" onclick="editVehicle()">Edit</button></div><div class="pillRow">${v.vin?`<span class="pill">VIN ${esc(v.vin)}</span>`:''}${v.license_plate?`<span class="pill">Plate ${esc(v.license_plate)}</span>`:''}</div></div><div class="card"><h3>Repair History</h3><div class="searchRow"><input class="input" id="historyQ" placeholder="RO number, file name or keywords" oninput="filterHistory()"><input class="input" id="historyDate" type="date" onchange="filterHistory()"></div><button class="button good" onclick="newRepairFile()">Open New File</button></div><div id="historyList">${repairCards(repairs)}</div></main>`}
function repairCards(list){return list.map(r=>`<div class="card repairFile" onclick="openRepair('${r.id}')"><div class="topline"><div><h3>${esc(r.file_name||'Repair Updates')}</h3><div class="muted">${r.service_date?esc(fmtDate(r.service_date))+' • ':''}RO ${esc(r.ro_number)}</div><div class="pillRow">${r.keywords?`<span class="pill">${esc(r.keywords)}</span>`:''}<span class="pill">${esc(r.status)}</span></div></div><span>›</span></div></div>`).join('')||'<div class="card">No repair files for this vehicle yet.</div>'}
function filterHistory(){const q=document.getElementById('historyQ').value.toLowerCase().trim(),d=document.getElementById('historyDate').value;const list=repairs.filter(r=>(!q||[r.ro_number,r.file_name,r.keywords,r.internal_notes,r.technician].join(' ').toLowerCase().includes(q))&&(!d||r.service_date===d));document.getElementById('historyList').innerHTML=repairCards(list)}
async function editVehicle(){const v=currentVehicle;const display_name=prompt('Vehicle file name',v.display_name||'');if(display_name===null)return;const customer_name=prompt('Customer name',v.customer_name||'')??v.customer_name;const customer_phone=prompt('Customer phone',v.customer_phone||'')??v.customer_phone;const vin=prompt('VIN',v.vin||'')??v.vin;const license_plate=prompt('License plate',v.license_plate||'')??v.license_plate;const {error}=await sb.from('vehicles').update({display_name,customer_name,customer_phone,vin,license_plate}).eq('id',v.id);if(error)return alert(error.message);await openVehicle(v.id)}
async function newRepairFile(){const v=currentVehicle;const file_name=prompt('Name this file. Example: Inspection, Repair Updates, Brake Job','Inspection');if(!file_name)return;const ro_number=prompt('RO number');if(!ro_number)return;const service_date=prompt('Service date YYYY-MM-DD',new Date().toISOString().slice(0,10))||new Date().toISOString().slice(0,10);const keywords=prompt('Keywords. Example: brakes noise front suspension')||'';const technician=prompt('Technician name')||'';const {data,error}=await sb.from('repairs').insert({vehicle_id:v.id,file_name,ro_number,service_date,keywords,technician,year:v.year,make:v.make,model:v.model,customer_name:v.customer_name,customer_phone:v.customer_phone}).select().single();if(error)return alert(error.message);await openRepair(data.id)}
async function renderGlobalSearch(){await loadDashboard();document.getElementById('app').innerHTML=head('Search Service History')+`<main><button class="button light" onclick="renderDashboard()">Back</button><div class="card"><h2>Search Everything</h2><input class="input" id="globalQ" placeholder="RO number, customer, VIN, vehicle, file name or keywords" oninput="runGlobalSearch()"><input class="input" id="globalDate" type="date" onchange="runGlobalSearch()"></div><div id="globalResults"><div class="card muted">Start typing to search all vehicle and repair files.</div></div></main>`}
function runGlobalSearch(){const q=document.getElementById('globalQ').value.toLowerCase().trim(),d=document.getElementById('globalDate').value;if(!q&&!d){document.getElementById('globalResults').innerHTML='<div class="card muted">Start typing to search all vehicle and repair files.</div>';return}const vm=new Map(vehicles.map(v=>[v.id,v]));const found=repairs.filter(r=>{const v=vm.get(r.vehicle_id)||{};const text=[r.ro_number,r.file_name,r.keywords,r.internal_notes,r.technician,v.display_name,v.year,v.make,v.model,v.vin,v.license_plate,v.customer_name,v.customer_phone].join(' ').toLowerCase();return(!q||text.includes(q))&&(!d||r.service_date===d)});document.getElementById('globalResults').innerHTML=found.map(r=>{const v=vm.get(r.vehicle_id)||{};return `<div class="card repairFile" onclick="openRepair('${r.id}')"><h3>${esc(r.file_name||'Repair Updates')}</h3><div>${esc(v.display_name||[v.year,v.make,v.model].filter(Boolean).join(' '))}</div><div class="muted">${fmtDate(r.service_date)} • RO ${esc(r.ro_number)}${v.customer_name?' • '+esc(v.customer_name):''}</div>${r.keywords?`<div class="pillRow"><span class="pill">${esc(r.keywords)}</span></div>`:''}</div>`}).join('')||'<div class="card">No matching repair history found.</div>'}
async function openRepair(id){const {data:r,error}=await sb.from('repairs').select('*').eq('id',id).single();if(error)return alert(error.message);current=r;if(r.vehicle_id){const {data:v}=await sb.from('vehicles').select('*').eq('id',r.vehicle_id).single();if(v)currentVehicle=v}const [{data:u},{data:m}]=await Promise.all([sb.from('repair_updates').select('*').eq('repair_id',id).order('created_at',{ascending:false}),sb.from('repair_media').select('*').eq('repair_id',id).order('created_at',{ascending:false})]);current.updates=u||[];currentMedia=m||[];renderRepair()}
function publicUrl(path){return sb.storage.from('repair-media').getPublicUrl(path).data.publicUrl}
function renderRepair(){const r=current,v=currentVehicle||{};document.getElementById('app').innerHTML=head(r.file_name||'Repair File')+`<main><button class="button light" onclick="${r.vehicle_id?`openVehicle('${r.vehicle_id}')`:'loadDashboard()'}">Back to Vehicle</button><div class="card"><div class="topline"><div><h2>${esc(r.file_name||'Repair Updates')}</h2><div>${esc(v.display_name||[r.year,r.make,r.model].filter(Boolean).join(' '))}</div><div class="muted">${fmtDate(r.service_date)} • RO ${esc(r.ro_number)}</div></div><span class="badge">${esc(r.status)}</span></div>${r.keywords?`<div class="pillRow"><span class="pill">${esc(r.keywords)}</span></div>`:''}</div><div class="card"><h3>Photos, Videos and Documents</h3><div class="addMedia" onclick="openAddMenu()"><button class="plus">+</button><div><b>Add attachment</b><div class="muted">Photo, video or document</div></div></div><div class="photoGrid" style="margin-top:12px">${currentMedia.map(mediaHtml).join('')}</div></div><div class="card"><h3>Add Repair Update</h3><textarea id="updateText" placeholder="Describe the work completed or what was found"></textarea><button class="button good" onclick="addUpdate()">Add Update</button></div><div class="card"><h3>Repair Timeline</h3><div class="timeline">${r.updates.map(u=>`<div class="event"><b>${esc(u.update_text)}</b><span class="muted">${fmt(u.created_at)}</span></div>`).join('')||'<span class="muted">No updates yet.</span>'}</div></div><div class="card"><h3>Internal Notes</h3><textarea id="notes">${esc(r.internal_notes||'')}</textarea><button class="button light" onclick="saveNotes()">Save Internal Notes</button></div><div class="card"><h3>Customer Link</h3><button class="button" onclick="shareCustomer()">Share Customer Link</button><button class="button light" onclick="location.hash='customer/${r.share_token}';init()">Preview Customer Page</button></div></main>`}
function imageIndex(id){return currentMedia.filter(x=>x.media_type==='image').findIndex(x=>x.id===id)}
function mediaHtml(m){const url=publicUrl(m.storage_path),name=m.original_name||'Document';if(m.media_type==='document')return `<div class="mediaCard"><div class="docCard"><div class="docIcon">📄</div><div><a class="docLink" href="${url}" target="_blank" rel="noopener">${esc(name)}</a><div class="muted">${fmt(m.created_at)}</div></div></div><button class="tinyDanger" onclick="deleteMedia('${m.id}','${encodeURIComponent(m.storage_path)}')">Delete Document</button></div>`;if(m.media_type==='video')return `<div class="mediaCard"><video class="media" controls playsinline src="${url}"></video><div class="muted">${fmt(m.created_at)}</div><button class="tinyDanger" onclick="deleteMedia('${m.id}','${encodeURIComponent(m.storage_path)}')">Delete Video</button></div>`;return `<div class="mediaCard"><img class="media" src="${url}" onclick="openGallery(${imageIndex(m.id)})"><div class="rowButtons"><button class="button light" onclick="editPhoto('${m.id}','${encodeURIComponent(url)}')">Draw or Write</button><button class="tinyDanger" onclick="deleteMedia('${m.id}','${encodeURIComponent(m.storage_path)}')">Delete Photo</button></div><div class="muted">${fmt(m.created_at)}</div></div>`}
function openGallery(start=0){const imgs=currentMedia.filter(x=>x.media_type==='image');if(!imgs.length)return;document.getElementById('gallery').innerHTML=`<div class="gallery"><div class="galleryTop"><b>${start+1} of ${imgs.length}</b><button class="galleryClose" onclick="closeGallery()">×</button></div><div class="galleryTrack" id="galleryTrack">${imgs.map((m,i)=>`<div class="gallerySlide"><img src="${publicUrl(m.storage_path)}" alt="Repair photo ${i+1}"></div>`).join('')}</div></div>`;requestAnimationFrame(()=>{const t=document.getElementById('galleryTrack');t.scrollLeft=start*t.clientWidth})}
function closeGallery(){document.getElementById('gallery').innerHTML=''}
function openAddMenu(){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalInner"><h3>Add Attachment</h3><button class="action" onclick="pickInput('photoLibrary')">Choose Photo</button><button class="action" onclick="pickInput('cameraPhoto')">Take Photo</button><button class="action" onclick="pickInput('videoInput')">Choose or Record Video</button><button class="action" onclick="pickInput('documentInput')">Choose Document</button><button class="button light" onclick="closeModal()">Cancel</button><input id="photoLibrary" class="hidden" type="file" accept="image/*" onchange="uploadMedia(event,'image')"><input id="cameraPhoto" class="hidden" type="file" accept="image/*" capture="environment" onchange="uploadMedia(event,'image')"><input id="videoInput" class="hidden" type="file" accept="video/*" onchange="uploadMedia(event,'video')"><input id="documentInput" class="hidden" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,application/pdf" onchange="uploadMedia(event,'document')"></div></div>`}
function pickInput(id){document.getElementById(id).click()}function closeModal(){document.getElementById('modal').innerHTML=''}
async function uploadMedia(e,type){const file=e.target.files[0];if(!file)return;closeModal();const fallback=type==='image'?'jpg':type==='video'?'mp4':'file';const ext=(file.name.split('.').pop()||fallback).replace(/[^a-zA-Z0-9]/g,'');const path=`${current.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('repair-media').upload(path,file,{contentType:file.type||undefined});if(error)return alert(error.message);const {error:dbError}=await sb.from('repair_media').insert({repair_id:current.id,media_type:type,storage_path:path,original_name:file.name||''});if(dbError){await sb.storage.from('repair-media').remove([path]);return alert(dbError.message)}await openRepair(current.id)}
async function deleteMedia(id,pathEnc){if(!confirm('Delete this attachment from the repair file?'))return;const path=decodeURIComponent(pathEnc);const {error:se}=await sb.storage.from('repair-media').remove([path]);if(se)return alert(se.message);const {error}=await sb.from('repair_media').delete().eq('id',id);if(error)return alert(error.message);await openRepair(current.id)}
async function addUpdate(){const t=document.getElementById('updateText').value.trim();if(!t)return;const {error}=await sb.from('repair_updates').insert({repair_id:current.id,update_text:t});if(error)return alert(error.message);await openRepair(current.id)}
async function saveNotes(){const internal_notes=document.getElementById('notes').value;const {error}=await sb.from('repairs').update({internal_notes}).eq('id',current.id);if(error)return alert(error.message);current.internal_notes=internal_notes;alert('Saved')}
function shareCustomer(){const url=location.href.split('#')[0]+'#customer/'+current.share_token;const name=(currentVehicle?.customer_name||current.customer_name||'').trim();const text=`Hey ${name||'there'}, here is your ${current.file_name||'repair'} update from Reliance Auto Mechanic.`;if(navigator.share)navigator.share({title:'Vehicle Repair Update',text,url}).catch(()=>{});else{navigator.clipboard.writeText(`${text} ${url}`);alert('Customer message and link copied')}}
async function renderCustomer(token){document.getElementById('app').innerHTML=head('Customer Repair Update')+'<main><div class="card">Loading repair update...</div></main>';const {data,error}=await sb.rpc('get_customer_repair',{p_token:token});if(error||!data){document.getElementById('app').innerHTML=head('Customer Repair Update')+'<main><div class="card">Repair update is not available.</div></main>';return}const r=data.repair,u=data.updates||[],m=data.media||[];const imgs=m.filter(x=>x.type==='image');window.customerImages=imgs;document.getElementById('app').innerHTML=head('Customer Repair Update')+`<main><div class="card" style="background:#111;color:#fff"><h2>${esc(r.year)} ${esc(r.make)} ${esc(r.model)}</h2><div>${esc(r.file_name||'Repair Update')} • RO ${esc(r.ro_number)}</div><p><span class="badge">${esc(r.status)}</span></p></div><div class="card"><h3>Repair Progress</h3><div class="timeline">${u.map(x=>`<div class="event"><b>${esc(x.text)}</b><span class="muted">${fmt(x.created_at)}</span></div>`).join('')||'<span class="muted">No updates yet.</span>'}</div></div><div class="card"><h3>Photos, Videos and Documents</h3><div class="photoGrid">${m.map((x)=>customerMediaHtml(x,imgs.findIndex(i=>i.path===x.path))).join('')||'<span class="muted">Media will appear here as work progresses.</span>'}</div></div></main>`}
function customerMediaHtml(x,idx){const url=publicUrl(x.path);if(x.type==='document')return `<div class="mediaCard"><div class="docCard"><div class="docIcon">📄</div><div><a class="docLink" href="${url}" target="_blank">${esc(x.name||'Document')}</a></div></div></div>`;if(x.type==='video')return `<div class="mediaCard"><video class="media" controls playsinline src="${url}"></video></div>`;return `<div class="mediaCard"><img class="media" src="${url}" onclick="openCustomerGallery(${idx})"></div>`}
function openCustomerGallery(start=0){const imgs=window.customerImages||[];if(!imgs.length)return;document.getElementById('gallery').innerHTML=`<div class="gallery"><div class="galleryTop"><b>${start+1} of ${imgs.length}</b><button class="galleryClose" onclick="closeGallery()">×</button></div><div class="galleryTrack" id="galleryTrack">${imgs.map((m,i)=>`<div class="gallerySlide"><img src="${publicUrl(m.path)}" alt="Repair photo ${i+1}"></div>`).join('')}</div></div>`;requestAnimationFrame(()=>{const t=document.getElementById('galleryTrack');t.scrollLeft=start*t.clientWidth})}
let editor={canvas:null,ctx:null,img:null,strokes:[],texts:[],mode:null,activeText:-1,last:null};
function editPhoto(id,urlEnc){const url=decodeURIComponent(urlEnc);document.getElementById('modal').innerHTML=`<div class="modal center"><div class="modalInner"><h3>Photo Markup</h3><div class="canvasWrap"><canvas id="editCanvas"></canvas></div><div class="toolbar"><button class="button light" onclick="addEditorText()">Add Text</button><button class="button light" onclick="resetEditor()">Reset</button><button class="button good" onclick="saveEditedPhoto()">Save Copy</button></div><button class="button danger" onclick="closeModal()">Close</button><p class="muted">Draw with your finger. Tap and drag text to move it.</p></div></div>`;const c=document.getElementById('editCanvas'),ctx=c.getContext('2d'),img=new Image();img.crossOrigin='anonymous';img.onload=()=>{const max=1200,s=Math.min(1,max/img.width);c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);editor={canvas:c,ctx,img,strokes:[],texts:[],mode:null,activeText:-1,last:null};redrawEditor()};img.src=url;const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*(c.width/r.width),y:(e.clientY-r.top)*(c.height/r.height)}};c.addEventListener('pointerdown',e=>{const p=pos(e);for(let i=editor.texts.length-1;i>=0;i--){const t=editor.texts[i],w=ctx.measureText(t.text).width,h=t.size;if(p.x>=t.x&&p.x<=t.x+w&&p.y>=t.y-h&&p.y<=t.y+8){editor.mode='text';editor.activeText=i;editor.last=p;c.setPointerCapture(e.pointerId);return}}editor.mode='draw';editor.strokes.push([p]);editor.last=p;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!editor.mode)return;const p=pos(e);if(editor.mode==='text'){const t=editor.texts[editor.activeText];t.x+=p.x-editor.last.x;t.y+=p.y-editor.last.y;editor.last=p;redrawEditor()}else{editor.strokes[editor.strokes.length-1].push(p);editor.last=p;redrawEditor()}});c.addEventListener('pointerup',()=>{editor.mode=null;editor.activeText=-1})}
function redrawEditor(){const {ctx,canvas,img,strokes,texts}=editor;if(!ctx)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.strokeStyle='#ff0000';ctx.lineWidth=Math.max(4,canvas.width/180);ctx.lineCap='round';for(const s of strokes){if(s.length<2)continue;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke()}ctx.fillStyle='#ff0000';for(const t of texts){ctx.font=`bold ${t.size}px sans-serif`;ctx.fillText(t.text,t.x,t.y)}}
function addEditorText(){const text=prompt('Text to add');if(!text||!editor.canvas)return;editor.texts.push({text,x:editor.canvas.width*.1,y:editor.canvas.height*.18,size:Math.max(28,editor.canvas.width/22)});redrawEditor()}
function resetEditor(){if(!editor.canvas)return;editor.strokes=[];editor.texts=[];redrawEditor()}
async function saveEditedPhoto(){if(!editor.canvas)return;editor.canvas.toBlob(async blob=>{const path=`${current.id}/${crypto.randomUUID()}.jpg`;const {error}=await sb.storage.from('repair-media').upload(path,blob,{contentType:'image/jpeg'});if(error)return alert(error.message);const {error:de}=await sb.from('repair_media').insert({repair_id:current.id,media_type:'image',storage_path:path,original_name:'Marked up photo.jpg'});if(de)return alert(de.message);closeModal();await openRepair(current.id)},'image/jpeg',.92)}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#customer/'))init()});init();
</script>
