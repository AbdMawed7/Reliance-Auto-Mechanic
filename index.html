<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Reliance Auto Mechanic</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111;color:#fff;padding:22px 18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}header small{opacity:.65}main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #00000012}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;background:#f0f1f3;border-radius:13px}.stat b{display:block;font-size:22px}.muted{color:#707070;font-size:13px}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#e7f5ea;color:#176b35;font-size:12px;font-weight:700}.button{width:100%;border:0;border-radius:13px;padding:13px;margin-top:9px;background:#111;color:#fff;font-weight:700;font-size:15px}.button.light{background:#ececef;color:#111}.button.good{background:#176b35}.input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;margin-top:7px;background:#fff}textarea{min-height:90px}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.photo{width:100%;height:135px;object-fit:cover;border-radius:13px;background:#ddd;margin-top:9px}.timeline{border-left:3px solid #ddd;padding-left:14px}.event{margin:0 0 18px}.event b{display:block}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}.nav button{border:0;padding:11px;border-radius:11px;background:#e5e5e7;font-weight:700}.nav button.active{background:#111;color:#fff}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.vehicle{cursor:pointer}.vehicle h3{margin:0 0 5px}.sectionTitle{margin-bottom:6px}.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body><div id="app"></div>
<script>
const KEY='reliance_app_v2';
const sample={vehicles:[{id:'RO18472',year:'2018',make:'Honda',model:'Civic',plate:'ABCD123',customer:'John Smith',phone:'4165550199',tech:'Mike',status:'Repair In Progress',internal:'Front brake repair. Customer approved.',updates:[{time:'3:05 PM',text:'Brake components inspected'},{time:'3:22 PM',text:'Old components removed'},{time:'3:42 PM',text:'New components installed'}],photos:[]}],view:'dashboard'};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||sample;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function head(){return `<header><h1>Reliance Auto Mechanic</h1><small>Repair Progress System</small></header>`}
function nav(){return `<div class="nav"><button class="${db.view==='dashboard'?'active':''}" onclick="setView('dashboard')">Dashboard</button><button class="${db.view==='tech'?'active':''}" onclick="setView('tech')">Technician</button><button class="${db.view==='writer'?'active':''}" onclick="setView('writer')">Service Writer</button></div>`}
function setView(v){db.view=v;save();location.hash='';render()}
function vehicle(id){return db.vehicles.find(v=>v.id===id)}
function vcard(v){return `<div class="card vehicle" onclick="openVehicle('${v.id}')"><div class="topline"><div><h3>${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</h3><div class="muted">RO ${esc(v.id)} • ${esc(v.customer)} • Tech: ${esc(v.tech)}</div></div><span class="badge">${esc(v.status)}</span></div><p>${v.photos.length} photos • ${v.updates.length} updates</p></div>`}
function dashboard(){return head()+`<main>${nav()}<div class="card"><h2 class="sectionTitle">Active Repairs</h2><p class="muted">Live repair progress for the shop.</p></div><div class="grid"><div class="stat"><b>${db.vehicles.length}</b><span class="muted">Vehicles</span></div><div class="stat"><b>${db.vehicles.reduce((n,v)=>n+v.photos.length,0)}</b><span class="muted">Photos</span></div></div>${db.vehicles.map(vcard).join('')}<button class="button" onclick="newVehicle()">Add Vehicle</button></main>`}
function tech(){return head()+`<main>${nav()}<div class="card"><h2>Technician</h2><p class="muted">Open a vehicle, take photos, and add repair updates.</p></div>${db.vehicles.map(vcard).join('')}</main>`}
function writer(){return head()+`<main>${nav()}<div class="card"><h2>Service Writer</h2><p class="muted">Review technician progress and share the customer page.</p></div>${db.vehicles.map(vcard).join('')}</main>`}
function newVehicle(){const id=prompt('Repair order number');if(!id)return;const year=prompt('Year')||'';const make=prompt('Make')||'';const model=prompt('Model')||'';const customer=prompt('Customer name')||'';const tech=prompt('Technician name')||'';db.vehicles.unshift({id,year,make,model,plate:'',customer,phone:'',tech,status:'Repair In Progress',internal:'',updates:[],photos:[]});save();render()}
function openVehicle(id){location.hash='vehicle/'+encodeURIComponent(id);render()}
function vehiclePage(v){return head()+`<main><button class="button light" onclick="location.hash='';render()">Back</button><div class="card"><div class="topline"><div><h2>${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</h2><div class="muted">RO ${esc(v.id)} • ${esc(v.customer)}</div></div><span class="badge">${esc(v.status)}</span></div></div><div class="card"><h3>Take repair photo</h3><input class="input" type="file" accept="image/*" capture="environment" onchange="addPhoto(event,'${v.id}')"><p class="muted">Use the phone camera or photo library.</p><div class="photoGrid">${v.photos.map(p=>`<img class="photo" src="${p.data}">`).join('')}</div></div><div class="card"><h3>Add repair update</h3><textarea id="updateText" placeholder="Example: Front pads and rotors installed."></textarea><button class="button good" onclick="addUpdate('${v.id}')">Add Update</button></div><div class="card"><h3>Repair timeline</h3><div class="timeline">${v.updates.slice().reverse().map(u=>`<div class="event"><b>${esc(u.text)}</b><span class="muted">${esc(u.time)}</span></div>`).join('')||'<span class="muted">No updates yet.</span>'}</div></div><div class="card"><h3>Internal note</h3><textarea id="internalNote">${esc(v.internal)}</textarea><button class="button light" onclick="saveNote('${v.id}')">Save Internal Note</button></div><div class="card"><h3>Customer sharing</h3><p class="muted">The customer sees only photos and repair updates. Internal notes stay private.</p><button class="button" onclick="shareCustomer('${v.id}')">Copy Customer Link</button><button class="button light" onclick="previewCustomer('${v.id}')">Preview Customer Page</button></div></main>`}
function addPhoto(e,id){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{vehicle(id).photos.push({data:r.result,time:new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})});save();render()};r.readAsDataURL(file)}
function addUpdate(id){const el=document.getElementById('updateText');const text=el.value.trim();if(!text)return;vehicle(id).updates.push({text,time:new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})});save();render()}
function saveNote(id){vehicle(id).internal=document.getElementById('internalNote').value;save();alert('Internal note saved')}
function shareCustomer(id){const url=location.href.split('#')[0]+'#customer/'+encodeURIComponent(id);if(navigator.share){navigator.share({title:'Vehicle Repair Update',text:'View your vehicle repair progress',url})}else{navigator.clipboard&&navigator.clipboard.writeText(url);alert(url)}}
function previewCustomer(id){location.hash='customer/'+encodeURIComponent(id);render()}
function customer(v){return head()+`<main><div class="card"><div class="topline"><div><h2>${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</h2><div class="muted">Repair Order ${esc(v.id)}</div></div><span class="badge">${esc(v.status)}</span></div></div><div class="card"><h3>Repair Progress</h3><div class="timeline">${v.updates.slice().reverse().map(u=>`<div class="event"><b>${esc(u.text)}</b><span class="muted">${esc(u.time)}</span></div>`).join('')||'<span class="muted">Updates will appear here.</span>'}</div></div><div class="card"><h3>Repair Photos</h3><div class="photoGrid">${v.photos.map(p=>`<img class="photo" src="${p.data}">`).join('')||'<p class="muted">Photos will appear here as work progresses.</p>'}</div></div><div class="card"><h3>Reliance Auto Mechanic</h3><p>Your vehicle repair page is updated as work progresses.</p></div></main>`}
function render(){const h=location.hash;if(h.startsWith('#vehicle/')){const v=vehicle(decodeURIComponent(h.split('/')[1]));document.getElementById('app').innerHTML=v?vehiclePage(v):dashboard();return}if(h.startsWith('#customer/')){const v=vehicle(decodeURIComponent(h.split('/')[1]));document.getElementById('app').innerHTML=v?customer(v):head()+'<main><div class="card">Repair order not found.</div></main>';return}document.getElementById('app').innerHTML=db.view==='tech'?tech():db.view==='writer'?writer():dashboard()}
window.addEventListener('hashchange',render);render();
</script></body></html>
