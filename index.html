<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Reliance Auto Mechanic</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111;color:#fff;padding:22px 18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}header small{opacity:.65}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #00000012}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#707070;font-size:13px}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#e7f5ea;color:#176b35;font-size:12px;font-weight:700}.button{width:100%;border:0;border-radius:13px;padding:13px;margin-top:9px;background:#111;color:#fff;font-weight:700;font-size:15px}.button.light{background:#ececef;color:#111}.button.good{background:#176b35}.button.danger{background:#8b1e1e}.input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;margin-top:7px;background:#fff}textarea{min-height:90px}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mediaCard{background:#f7f7f8;border-radius:14px;padding:8px}.media{width:100%;height:150px;object-fit:cover;border-radius:11px;background:#ddd}.timeline{border-left:3px solid #ddd;padding-left:14px}.event{margin:0 0 18px}.event b{display:block}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.vehicle{cursor:pointer}.vehicle h3{margin:0 0 5px}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.tabs button{border:0;padding:10px;border-radius:10px;background:#e7e7ea;font-weight:700}.tabs .active{background:#111;color:#fff}.modal{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}.modalInner{background:#fff;width:min(760px,100%);max-height:96vh;overflow:auto;border-radius:18px;padding:12px}.canvasWrap{background:#222;border-radius:12px;overflow:auto;text-align:center}.canvasWrap canvas{max-width:100%;touch-action:none}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.status{padding:10px;border-radius:10px;background:#fff4d6;color:#6f4c00;margin:10px 0}.login{max-width:460px;margin:30px auto}.customerHead{background:#111;color:#fff;border-radius:17px;padding:18px}.hidden{display:none}@media(max-width:520px){.photoGrid{grid-template-columns:1fr}.media{height:210px}}
</style>
</head>
<body><div id="app"></div><div id="modal"></div>
<script>
const SUPABASE_URL='https://qsexlyqyfvncnudqhlzu.supabase.co';
const SUPABASE_KEY='sb_publishable_rO6RO8kd83amNcv6s9NCWw_PvS_zIn5';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null, repairs=[], current=null, currentMedia=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=d=>new Date(d).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function head(sub='Repair Progress System'){return `<header><h1>Reliance Auto Mechanic</h1><small>${sub}</small></header>`}
async function init(){const hash=location.hash;if(hash.startsWith('#customer/')){await renderCustomer(hash.split('/')[1]);return}const {data}=await sb.auth.getSession();session=data.session;if(!session){renderLogin();return}await loadRepairs();}
function renderLogin(msg=''){document.getElementById('app').innerHTML=head('Staff Login')+`<main class="login"><div class="card"><h2>Staff Sign In</h2>${msg?`<div class="status">${esc(msg)}</div>`:''}<input class="input" id="email" type="email" placeholder="Email"><input class="input" id="password" type="password" placeholder="Password"><button class="button" onclick="signIn()">Sign In</button><button class="button light" onclick="signUp()">Create Staff Account</button><p class="muted">Use a shop staff account. Customer pages do not require login.</p></div></main>`}
async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error)return renderLogin(error.message);init()}
async function signUp(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signUp({email,password});if(error)return renderLogin(error.message);renderLogin('Account created. Check your email if Supabase asks you to confirm it, then sign in.')}
async function signOut(){await sb.auth.signOut();session=null;renderLogin()}
async function loadRepairs(){const {data,error}=await sb.from('repairs').select('*').order('created_at',{ascending:false});if(error)return setupNeeded(error.message);repairs=data||[];renderDashboard()}
function setupNeeded(msg){document.getElementById('app').innerHTML=head('Cloud Setup Needed')+`<main><div class="card"><h2>One setup step remains</h2><p>The app is connected to Supabase, but the database tables are not ready yet.</p><div class="status">${esc(msg)}</div><p class="muted">Open the Supabase SQL Editor and run the setup script from the repository file named supabase-setup.sql.</p></div></main>`}
function renderDashboard(){document.getElementById('app').innerHTML=head()+`<main><div class="tabs"><button class="active">Dashboard</button><button onclick="newRepair()">New Repair</button><button onclick="signOut()">Sign Out</button></div><div class="card"><h2>Active Repairs</h2><p class="muted">Cloud synced across staff phones.</p></div>${repairs.map(r=>`<div class="card vehicle" onclick="openRepair('${r.id}')"><div class="topline"><div><h3>${esc(r.year)} ${esc(r.make)} ${esc(r.model)}</h3><div class="muted">RO ${esc(r.ro_number)} • ${esc(r.customer_name)} • Tech: ${esc(r.technician)}</div></div><span class="badge">${esc(r.status)}</span></div></div>`).join('')||'<div class="card">No repair orders yet.</div>'}<button class="button" onclick="newRepair()">Add Vehicle</button></main>`}
async function newRepair(){const ro=prompt('Repair order number');if(!ro)return;const year=prompt('Year')||'',make=prompt('Make')||'',model=prompt('Model')||'',customer_name=prompt('Customer name')||'',customer_phone=prompt('Customer phone')||'',technician=prompt('Technician name')||'';const {data,error}=await sb.from('repairs').insert({ro_number:ro,year,make,model,customer_name,customer_phone,technician}).select().single();if(error)return alert(error.message);await loadRepairs();openRepair(data.id)}
async function openRepair(id){const {data:r,error}=await sb.from('repairs').select('*').eq('id',id).single();if(error)return alert(error.message);current=r;const [{data:updates},{data:media}]=await Promise.all([sb.from('repair_updates').select('*').eq('repair_id',id).order('created_at',{ascending:false}),sb.from('repair_media').select('*').eq('repair_id',id).order('created_at',{ascending:false})]);current.updates=updates||[];currentMedia=media||[];renderRepair()}
function publicUrl(path){return sb.storage.from('repair-media').getPublicUrl(path).data.publicUrl}
function renderRepair(){const r=current;document.getElementById('app').innerHTML=head()+`<main><button class="button light" onclick="loadRepairs()">Back to Dashboard</button><div class="card"><div class="topline"><div><h2>${esc(r.year)} ${esc(r.make)} ${esc(r.model)}</h2><div class="muted">RO ${esc(r.ro_number)} • ${esc(r.customer_name)}</div></div><span class="badge">${esc(r.status)}</span></div></div><div class="card"><h3>Photos and Videos</h3><input class="input" type="file" accept="image/*" onchange="uploadMedia(event,'image')"><input class="input" type="file" accept="image/*" capture="environment" onchange="uploadMedia(event,'image')"><input class="input" type="file" accept="video/*" onchange="uploadMedia(event,'video')"><input class="input" type="file" accept="video/*" capture="environment" onchange="uploadMedia(event,'video')"><p class="muted">Choose from Photos, take a new picture, choose a video, or record a new video.</p><div class="photoGrid">${currentMedia.map(mediaHtml).join('')}</div></div><div class="card"><h3>Add Repair Update</h3><textarea id="updateText" placeholder="Example: Front pads and rotors installed."></textarea><button class="button good" onclick="addUpdate()">Add Update</button></div><div class="card"><h3>Repair Timeline</h3><div class="timeline">${r.updates.map(u=>`<div class="event"><b>${esc(u.update_text)}</b><span class="muted">${fmt(u.created_at)}</span></div>`).join('')||'<span class="muted">No updates yet.</span>'}</div></div><div class="card"><h3>Internal Notes</h3><textarea id="notes">${esc(r.internal_notes)}</textarea><button class="button light" onclick="saveNotes()">Save Internal Notes</button></div><div class="card"><h3>Customer Link</h3><p class="muted">This link works on another phone because the repair data is now stored in Supabase.</p><button class="button" onclick="shareCustomer()">Share Customer Link</button><button class="button light" onclick="location.hash='customer/${r.share_token}';init()">Preview Customer Page</button></div></main>`}
function mediaHtml(m){const url=publicUrl(m.storage_path);if(m.media_type==='video')return `<div class="mediaCard"><video class="media" controls playsinline src="${url}"></video><div class="muted">${fmt(m.created_at)}</div></div>`;return `<div class="mediaCard"><img class="media" src="${url}"><button class="button light" onclick="editPhoto('${m.id}','${encodeURIComponent(url)}')">Draw or Write</button><div class="muted">${fmt(m.created_at)}</div></div>`}
async function uploadMedia(e,type){const file=e.target.files[0];if(!file)return;const ext=(file.name.split('.').pop()|| (type==='image'?'jpg':'mp4')).replace(/[^a-zA-Z0-9]/g,'');const path=`${current.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('repair-media').upload(path,file,{contentType:file.type||undefined});if(error)return alert(error.message);const res=await sb.from('repair_media').insert({repair_id:current.id,media_type:type,storage_path:path});if(res.error)return alert(res.error.message);await openRepair(current.id)}
async function addUpdate(){const t=document.getElementById('updateText').value.trim();if(!t)return;const {error}=await sb.from('repair_updates').insert({repair_id:current.id,update_text:t});if(error)return alert(error.message);await openRepair(current.id)}
async function saveNotes(){const internal_notes=document.getElementById('notes').value;const {error}=await sb.from('repairs').update({internal_notes}).eq('id',current.id);if(error)return alert(error.message);current.internal_notes=internal_notes;alert('Saved')}
function shareCustomer(){const url=location.href.split('#')[0]+'#customer/'+current.share_token;if(navigator.share)navigator.share({title:'Vehicle Repair Update',text:'View your vehicle repair progress',url});else{navigator.clipboard.writeText(url);alert('Customer link copied')}}
async function renderCustomer(token){document.getElementById('app').innerHTML=head('Customer Repair Update')+'<main><div class="card">Loading repair update...</div></main>';const {data,error}=await sb.rpc('get_customer_repair',{p_token:token});if(error||!data){document.getElementById('app').innerHTML=head('Customer Repair Update')+'<main><div class="card">Repair update is not available.</div></main>';return}const r=data.repair,u=data.updates||[],m=data.media||[];document.getElementById('app').innerHTML=head('Customer Repair Update')+`<main><div class="customerHead"><h2>${esc(r.year)} ${esc(r.make)} ${esc(r.model)}</h2><div>Repair Order ${esc(r.ro_number)}</div><p><span class="badge">${esc(r.status)}</span></p></div><div class="card"><h3>Repair Progress</h3><div class="timeline">${u.map(x=>`<div class="event"><b>${esc(x.text)}</b><span class="muted">${fmt(x.created_at)}</span></div>`).join('')||'<span class="muted">No updates yet.</span>'}</div></div><div class="card"><h3>Photos and Videos</h3><div class="photoGrid">${m.map(x=>x.type==='video'?`<div class="mediaCard"><video class="media" controls playsinline src="${publicUrl(x.path)}"></video></div>`:`<div class="mediaCard"><img class="media" src="${publicUrl(x.path)}"></div>`).join('')||'<span class="muted">Media will appear here as work progresses.</span>'}</div></div><div class="card"><h3>Reliance Auto Mechanic</h3><p>Your repair page updates as work progresses.</p></div></main>`}
let editor={canvas:null,ctx:null,img:null,drawing:false,last:null,sourceId:null};
function editPhoto(id,urlEnc){const url=decodeURIComponent(urlEnc);document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalInner"><h3>Photo Markup</h3><div class="canvasWrap"><canvas id="editCanvas"></canvas></div><div class="toolbar"><button class="button light" onclick="addText()">Add Text</button><button class="button light" onclick="resetCanvas()">Reset</button><button class="button good" onclick="saveEditedPhoto()">Save Copy</button></div><button class="button danger" onclick="closeEditor()">Close</button><p class="muted">Draw with your finger directly on the photo.</p></div></div>`;const c=document.getElementById('editCanvas'),ctx=c.getContext('2d'),img=new Image();img.crossOrigin='anonymous';img.onload=()=>{const max=1200,scale=Math.min(1,max/img.width);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);ctx.drawImage(img,0,0,c.width,c.height);ctx.lineWidth=Math.max(4,c.width/180);ctx.lineCap='round';ctx.strokeStyle='#ff0000';ctx.fillStyle='#ff0000';ctx.font=`bold ${Math.max(28,c.width/22)}px sans-serif`;};img.src=url;editor={canvas:c,ctx,img,drawing:false,last:null,sourceId:id};const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*(c.width/r.width),y:(p.clientY-r.top)*(c.height/r.height)}};c.addEventListener('pointerdown',e=>{editor.drawing=true;editor.last=pos(e)});c.addEventListener('pointermove',e=>{if(!editor.drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(editor.last.x,editor.last.y);ctx.lineTo(p.x,p.y);ctx.stroke();editor.last=p});window.addEventListener('pointerup',()=>editor.drawing=false,{once:false})}
function addText(){if(!editor.canvas)return;const text=prompt('Text to add');if(!text)return;const x=prompt('Horizontal position percent, 0 to 100','10'),y=prompt('Vertical position percent, 0 to 100','15');editor.ctx.fillText(text,editor.canvas.width*(Number(x)/100),editor.canvas.height*(Number(y)/100))}
function resetCanvas(){if(editor.img)editor.ctx.drawImage(editor.img,0,0,editor.canvas.width,editor.canvas.height)}
function closeEditor(){document.getElementById('modal').innerHTML=''}
async function saveEditedPhoto(){editor.canvas.toBlob(async blob=>{if(!blob)return;const path=`${current.id}/${crypto.randomUUID()}-marked.jpg`;const {error}=await sb.storage.from('repair-media').upload(path,blob,{contentType:'image/jpeg'});if(error)return alert(error.message);const res=await sb.from('repair_media').insert({repair_id:current.id,media_type:'image',storage_path:path,caption:'Marked up photo'});if(res.error)return alert(res.error.message);closeEditor();await openRepair(current.id)},'image/jpeg',0.9)}
window.addEventListener('hashchange',init);init();
</script></body></html>
